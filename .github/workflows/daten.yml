# Tägliches Daten-Update der GitHub-Version: Champion-Katalog, geänderte Champions aus den Patch Notes und
# alle Turnierspiele seit dem 1. Januar des Vorjahres (Leaguepedia). Daraus: Winrates, Matchups, Best in Slot.
# Läuft auf den Servern von GitHub, unabhängig von Claude. Fehler stehen im Reiter „Actions“ des Repos.
name: Daten-Update
on:
  schedule:
    - cron: '17 4 * * *'   # täglich 04:17 UTC (05:17 bzw. 06:17 deutsche Zeit)
  workflow_dispatch: {}    # von Hand starten: Actions → Daten-Update → Run workflow
permissions:
  contents: write
  pages: write
concurrency:
  group: daten-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Champion-Katalog holen
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python3 -I tools/riftroom_update.py "$RUNNER_TEMP/out" | tee "$RUNNER_TEMP/update.log"
          tail -n 1 "$RUNNER_TEMP/update.log" | grep -q '^ok'
      - name: Geänderte Champions aus den Patch Notes
        continue-on-error: true
        run: python3 -I tools/riftroom_patchnotes.py "$RUNNER_TEMP/out"
      - name: Turnierspiele holen (Leaguepedia)
        continue-on-error: true
        env:
          LEAGUEPEDIA_USER: ${{ secrets.LEAGUEPEDIA_USER }}
          LEAGUEPEDIA_PASS: ${{ secrets.LEAGUEPEDIA_PASS }}
        run: python3 -I tools/riftroom_pro.py . --max-anfragen 600
      - name: Turnierspiele auswerten
        run: if [ -s data/pro/games.jsonl ]; then python3 -I tools/riftroom_proagg.py . "$RUNNER_TEMP/out"; else echo "Noch keine Turnierspiele."; fi
      - name: data/meta.json schreiben
        run: python3 -I tools/riftroom_pages.py "$RUNNER_TEMP/out" .
      - name: Speichern und Seite neu bauen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "riftroom-daten"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/meta.json data/matchups.json
          [ -f data/pro/games.jsonl ] && git add data/pro/games.jsonl
          if git diff --cached --quiet; then echo "Nichts Neues."; exit 0; fi
          patch=$(python3 -I -c "import json;s=json.load(open('data/meta.json'))['current']['snapshot'];print(s.get('span') and 'Turniere '+s['span']+', '+str(s['matches'])+' Spiele' or 'Patch '+s['patch'])")
          git commit -m "Daten-Update $patch"
          git push || { git pull --rebase && git push; }
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null 2>&1 || echo "Pages baut von selbst."
