# Tägliches Daten-Update der GitHub-Version: Winrates (Master+), Best in Slot (Master+ und Grandmaster+),
# geänderte Champions aus den Patch Notes und, bei neuem Patch oder wöchentlich, die Lane-Matchups.
# Läuft auf den Servern von GitHub, unabhängig von Claude. Fehler stehen im Reiter „Actions“ des Repos.
name: Daten-Update
on:
  schedule:
    - cron: '17 4 * * *'   # täglich 04:17 UTC (05:17 bzw. 06:17 deutsche Zeit)
  workflow_dispatch: {}    # von Hand starten: Actions → Daten-Update → Run workflow
permissions:
  contents: write
  pages: write
concurrency:
  group: daten-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Winrates, Best in Slot und Katalog holen
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python3 -I tools/riftroom_update.py "$RUNNER_TEMP/out" | tee "$RUNNER_TEMP/update.log"
          tail -n 1 "$RUNNER_TEMP/update.log" | grep -q '^ok'
      - name: Geänderte Champions aus den Patch Notes
        continue-on-error: true
        run: python3 -I tools/riftroom_patchnotes.py "$RUNNER_TEMP/out"
      - name: Lane-Matchups (bei neuem Patch oder älter als 7 Tage)
        continue-on-error: true
        run: |
          if python3 -I - "$RUNNER_TEMP/out/current.json" data/matchups.json <<'EOF'
          import json, sys
          from datetime import datetime, timezone, timedelta
          cur = json.load(open(sys.argv[1]))['snapshot']['patch']
          try:
              m = json.load(open(sys.argv[2]))
              old = datetime.fromisoformat(m['updatedAt'].replace('Z', '+00:00')) < datetime.now(timezone.utc) - timedelta(days=7)
              sys.exit(0 if (m.get('patch') != cur or old) else 1)
          except Exception:
              sys.exit(0)
          EOF
          then
            python3 -I tools/riftroom_matchups.py "$RUNNER_TEMP/out/current.json" "$RUNNER_TEMP/out/matchups.json" "$RUNNER_TEMP/out/catalog.json"
            cp "$RUNNER_TEMP/out/matchups.json" data/matchups.json
          else
            echo "Matchups sind aktuell."
          fi
      - name: data/meta.json schreiben
        run: python3 -I tools/riftroom_pages.py "$RUNNER_TEMP/out" .
      - name: Speichern und Seite neu bauen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "riftroom-daten"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/meta.json data/matchups.json
          if git diff --cached --quiet; then echo "Nichts Neues."; exit 0; fi
          patch=$(python3 -I -c "import json;print(json.load(open('data/meta.json'))['current']['snapshot']['patch'])")
          git commit -m "Daten-Update Patch $patch"
          git push || { git pull --rebase && git push; }
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null 2>&1 || echo "Pages baut von selbst."
