<!doctype html>
<html lang="en" data-standalone="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Riftroom Draft Lab</title>
<meta name="description" content="Your room for better League of Legends drafts: champion pools, team composition and transparent meta data.">
<meta name="theme-color" content="#0e1116">
<link rel="icon" href="icon.svg" type="image/svg+xml">

<body>
<div id="splash" aria-hidden="true">

    <div class="sp-sub">Draft Lab</div>
  </div>
</div>
<div id="app"><div class="boot">Riftroom …</div></div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="picker" aria-labelledby="picker-title"></dialog>
<dialog id="confirm-dialog" aria-labelledby="confirm-title"></dialog>
<script type="module" src="boot.js"></script>
